[project]
name = "oop_ml"
version = "0.1.0"
description = "An object-oriented machine learning library for Python: named features, typed errors, and results that are objects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeffrey Gordon", email = "aemonalgiz@gmail.com" }]
keywords = [
    "machine-learning",
    "regression",
    "object-oriented",
    "type-hints",
    "scikit-learn-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/aemonalgiz-dev/oop_ml"
Repository = "https://github.com/aemonalgiz-dev/oop_ml"
Issues = "https://github.com/aemonalgiz-dev/oop_ml/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Only the benchmarks need scikit-learn. The library itself does not depend on
# it, and nothing under oop_ml/ imports it.
benchmark = [
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oop_ml*"]

# PEP 561: without this marker a consumer's type checker treats oop_ml as
# untyped, and every annotation in the library is invisible to them.
[tool.setuptools.package-data]
oop_ml = ["py.typed"]

[tool.pytest.ini_options]
# Put the project root on sys.path so `import oop_ml` resolves
# when running pytest from a plain terminal (PyCharm does this for you).
pythonpath = ["."]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
# Resolve imports against the project virtualenv so numpy/pydantic/pytest are
# found when pyright runs from a plain terminal.
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["oop_ml", "examples", "benchmarks", "test"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["E501"]
