[project]
name = "oop_ml"
version = "0.1.0"
description = "An object-oriented machine learning library for Python: named features, typed errors, and results that are objects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeffrey Gordon", email = "aemonalgiz@gmail.com" }]
keywords = [
    "machine-learning",
    "regression",
    "object-oriented",
    "type-hints",
    "scikit-learn-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/aemonalgiz-dev/oop_ml"
Repository = "https://github.com/aemonalgiz-dev/oop_ml"
Issues = "https://github.com/aemonalgiz-dev/oop_ml/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# The scikit-learn backend. Optional, because oop_ml.numpy is the reference
# implementation and needs nothing beyond the three required dependencies, so
# a caller who only wants the from-scratch models should not have to install
# an engine to get them. oop_ml.scikit is the one part of the package that
# does import it, and it says so at import time rather than failing with a
# bare ModuleNotFoundError.
#
# The floor is 1.9 rather than something older because LinearRegression.tol is
# only interpreted as lstsq's cond on dense data from 1.9, and
# MultipleLinearRegression's collinearity refusal is built on that. Below it
# the pin is accepted and ignored, which is a wrong answer rather than a
# failure, so oop_ml/scikit/engine_version.py enforces the same floor at
# import rather than trusting this line to be honoured.
scikit = [
    "scikit-learn>=1.9",
]
# The benchmarks time the numpy backend against the same engine.
benchmark = [
    "scikit-learn>=1.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oop_ml*"]

# PEP 561: without this marker a consumer's type checker treats oop_ml as
# untyped, and every annotation in the library is invisible to them.
[tool.setuptools.package-data]
oop_ml = ["py.typed"]

[tool.pytest.ini_options]
# Put the project root on sys.path so `import oop_ml` resolves
# when running pytest from a plain terminal (PyCharm does this for you).
pythonpath = ["."]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
# Resolve imports against the project virtualenv so numpy/pydantic/pytest are
# found when pyright runs from a plain terminal.
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["oop_ml", "examples", "benchmarks", "test"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["E501"]
# The one place an import is deliberately not at the top. This backend's
# submodules import scikit-learn, so the guard that turns a missing or too-old
# engine into a sentence has to run before them, and the alternative is four
# noqa comments saying the same thing less clearly.
"oop_ml/scikit/__init__.py" = ["E402"]
